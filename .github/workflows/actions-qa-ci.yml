name: actions-qa-ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-qa-ci:
    name: actions-qa-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the workflows with actions-qa-ci
        uses: LongTermSupport/actions-qa-ci@5cee0932cc3e49ed6e4e1085a7c66fcec361707e # v0.1.2
